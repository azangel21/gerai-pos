<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gerai POS - Orders & Sales</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f5f7;
    color: #222;
}

/* HEADER */

header {
    background: white;
    padding: 20px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    border-bottom: 1px solid #ddd;
}

header h1 {
    font-size: 25px;
}

header p {
    color: #777;
    margin-top: 4px;
}

.back-button {
    border: none;
    background: #222;
    color: white;

    padding: 14px 20px;
    border-radius: 12px;

    font-weight: 650;
    cursor: pointer;
}

/* MAIN */

main {
    max-width: 1300px;
    margin: auto;
    padding: 25px 30px;
}

/* FILTERS */

.filters {
    background: white;
    padding: 15px;
    border-radius: 16px;
    margin-bottom: 20px;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

.filter-button {
    border: none;
    background: #eee;

    padding: 11px 16px;
    border-radius: 10px;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

.filter-button.active {
    background: #222;
    color: white;
}

.date-input {
    border: 1px solid #ddd;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
}

.status-filters {
    display: flex;
    gap: 8px;
    margin-left: auto;
}

/* SUMMARY */

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 21px;
    border-radius: 17px;

    box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.card p {
    color: #777;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .4px;
}

.card h2 {
    font-size: 29px;
    margin-top: 7px;
}

/* DASHBOARD */

.dashboard-grid {
    display: grid;
    grid-template-columns: .8fr 1.4fr;
    gap: 20px;
}

.panel {
    background: white;
    padding: 22px;
    border-radius: 18px;

    box-shadow: 0 3px 12px rgba(0,0,0,.04);
}

.panel h2 {
    margin-bottom: 18px;
    font-size: 19px;
}

/* ITEMS */

.item-row {
    display: flex;
    justify-content: space-between;

    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.item-name {
    font-weight: 600;
}

.item-count {
    background: #eee;
    padding: 5px 11px;

    border-radius: 9px;
    font-weight: 700;
}

/* ORDERS */

.order {
    border: 1px solid #eee;
    border-radius: 14px;

    padding: 16px;
    margin-bottom: 12px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 10px;
}

.order-number {
    font-weight: 750;
    font-size: 16px;
}

.order-time {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
}

.status {
    display: inline-block;

    padding: 6px 10px;
    border-radius: 20px;

    font-size: 12px;
    font-weight: 750;
}

.status-paid {
    background: #dcf7e5;
    color: #16743b;
}

.status-pending {
    background: #fff0cf;
    color: #8a5d00;
}

/* ORDER ITEMS */

.order-items {
    margin-top: 13px;
    padding-top: 12px;

    border-top: 1px solid #eee;
}

.order-item {
    display: flex;
    justify-content: space-between;

    gap: 15px;
    padding: 5px 0;

    font-size: 14px;
}

.order-addon {
    color: #777;
    font-size: 12px;

    margin: 2px 0 5px 15px;
}

/* ORDER FOOTER */

.order-footer {
    margin-top: 12px;
    padding-top: 12px;

    border-top: 1px solid #eee;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.order-total {
    font-size: 19px;
    font-weight: 750;
}

.order-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;

    justify-content: flex-end;
}

/* MARK PAID */

.mark-paid {
    border: none;

    background: #222;
    color: white;

    padding: 10px 14px;
    border-radius: 10px;

    font-weight: 650;
    cursor: pointer;
}

/* DELETE */

.delete-order {
    border: none;

    background: #ffe8e8;
    color: #b42318;

    padding: 10px 14px;
    border-radius: 10px;

    font-weight: 650;
    cursor: pointer;
}

.delete-order:active,
.mark-paid:active {
    transform: scale(.97);
}

/* EMPTY */

.empty {
    color: #999;
    text-align: center;
    padding: 45px 10px;
}

/* IPAD */

@media (max-width: 950px) {

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .status-filters {
        margin-left: 0;
        width: 100%;
    }
}

</style>
</head>


<body>

<header>

    <div>
        <h1>📋 Orders & Sales</h1>

        <p id="viewTitle">
            Today's orders
        </p>
    </div>

    <button
        class="back-button"
        onclick="window.location.href='index.html'">

        ← Cashier

    </button>

</header>


<main>

<!-- FILTERS -->

<div class="filters">

    <button
        class="filter-button active"
        onclick="setDateFilter('today', this)">
        Today
    </button>

    <button
        class="filter-button"
        onclick="setDateFilter('yesterday', this)">
        Yesterday
    </button>

    <button
        class="filter-button"
        onclick="setDateFilter('all', this)">
        All Time
    </button>

    <input
        id="datePicker"
        class="date-input"
        type="date"
        onchange="chooseDate()">

    <div class="status-filters">

        <button
            class="filter-button active"
            onclick="setStatusFilter('All', this)">
            All
        </button>

        <button
            class="filter-button"
            onclick="setStatusFilter('Pending', this)">
            Pending
        </button>

        <button
            class="filter-button"
            onclick="setStatusFilter('Paid', this)">
            Paid
        </button>

    </div>

</div>


<!-- SUMMARY -->

<section class="summary">

    <div class="card">
        <p>PAID SALES</p>
        <h2 id="paidSales">$0.00</h2>
    </div>

    <div class="card">
        <p>TOTAL ORDERS</p>
        <h2 id="totalOrders">0</h2>
    </div>

    <div class="card">
        <p>PAID ORDERS</p>
        <h2 id="paidOrders">0</h2>
    </div>

    <div class="card">
        <p>PENDING ORDERS</p>
        <h2 id="pendingOrders">0</h2>
    </div>

</section>


<section class="dashboard-grid">

    <div class="panel">

        <h2>Items Purchased</h2>

        <div id="itemBreakdown"></div>

    </div>


    <div class="panel">

        <h2>Order History</h2>

        <div id="orderHistory"></div>

    </div>

</section>

</main>


<script>

// ==========================================
// MIGRATE OLD SALES
// ==========================================

function migrateOldSales() {

    const alreadyMigrated =
        localStorage.getItem("geraiOldSalesMigrated");

    if (alreadyMigrated === "yes") {
        return;
    }

    const oldSales =
        JSON.parse(
            localStorage.getItem("geraiSales")
        ) || [];

    const orders =
        JSON.parse(
            localStorage.getItem("geraiOrders")
        ) || [];

    oldSales.forEach(oldSale => {

        const exists =
            orders.some(
                order => order.id === oldSale.id
            );

        if (!exists) {

            orders.push({

                id: oldSale.id,

                orderNumber: null,

                date:
                    oldSale.date ||
                    new Date(
                        oldSale.id
                    ).toLocaleString(),

                items:
                    oldSale.items || [],

                total:
                    Number(oldSale.total) || 0,

                status: "Paid",

                migrated: true

            });

        }

    });


    orders.sort(
        (a, b) => a.id - b.id
    );


    orders.forEach(
        (order, index) => {

            if (!order.orderNumber) {
                order.orderNumber =
                    index + 1;
            }

        }
    );


    localStorage.setItem(
        "geraiOrders",
        JSON.stringify(orders)
    );


    const oldCounter =
        parseInt(
            localStorage.getItem(
                "geraiOrderCounter"
            )
        ) || 0;


    if (orders.length > oldCounter) {

        localStorage.setItem(
            "geraiOrderCounter",
            orders.length
        );

    }


    localStorage.setItem(
        "geraiOldSalesMigrated",
        "yes"
    );
}


migrateOldSales();


// ==========================================
// STATE
// ==========================================

let dateFilter = "today";

let chosenDate = null;

let statusFilter = "All";


// ==========================================
// HELPERS
// ==========================================

function getOrders() {

    return JSON.parse(
        localStorage.getItem(
            "geraiOrders"
        )
    ) || [];

}


function getOrderDate(order) {

    return new Date(order.id);

}


function sameDay(date1, date2) {

    return (

        date1.getFullYear() ===
        date2.getFullYear()

        &&

        date1.getMonth() ===
        date2.getMonth()

        &&

        date1.getDate() ===
        date2.getDate()

    );

}


// ==========================================
// DATE FILTER
// ==========================================

function setDateFilter(
    filter,
    button
) {

    dateFilter = filter;

    chosenDate = null;


    document
        .getElementById(
            "datePicker"
        )
        .value = "";


    document
        .querySelectorAll(
            ".filters > .filter-button"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    renderDashboard();

}


function chooseDate() {

    const value =
        document
            .getElementById(
                "datePicker"
            )
            .value;


    if (!value) {
        return;
    }


    const parts =
        value.split("-");


    chosenDate =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    dateFilter = "chosen";


    document
        .querySelectorAll(
            ".filters > .filter-button"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    renderDashboard();

}


// ==========================================
// STATUS FILTER
// ==========================================

function setStatusFilter(
    status,
    button
) {

    statusFilter = status;


    document
        .querySelectorAll(
            ".status-filters .filter-button"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    renderDashboard();

}


// ==========================================
// FILTER ORDERS
// ==========================================

function getDateFilteredOrders() {

    const orders = getOrders();

    const now = new Date();

    let targetDate =
        new Date(now);


    if (
        dateFilter ===
        "yesterday"
    ) {

        targetDate.setDate(
            targetDate.getDate() - 1
        );

    }


    return orders.filter(order => {

        const orderDate =
            getOrderDate(order);


        if (
            dateFilter === "all"
        ) {

            return true;

        }


        if (
            dateFilter === "chosen"
        ) {

            return sameDay(
                orderDate,
                chosenDate
            );

        }


        return sameDay(
            orderDate,
            targetDate
        );

    });

}


// ==========================================
// MARK AS PAID
// ==========================================

function markPaid(orderId) {

    const orders = getOrders();


    const order =
        orders.find(
            order =>
                order.id === orderId
        );


    if (!order) {
        return;
    }


    const confirmation =
        confirm(
            `Mark Order #${order.orderNumber} as paid?`
        );


    if (!confirmation) {
        return;
    }


    order.status = "Paid";

    order.paidAt = Date.now();


    localStorage.setItem(
        "geraiOrders",
        JSON.stringify(orders)
    );


    renderDashboard();

}


// ==========================================
// DELETE ORDER
// ==========================================

function deleteOrder(orderId) {

    const orders = getOrders();


    const order =
        orders.find(
            order =>
                order.id === orderId
        );


    if (!order) {
        return;
    }


    const confirmation =
        confirm(
            `Delete Order #${order.orderNumber}?\n\n` +
            `Total: $${Number(order.total).toFixed(2)}\n\n` +
            `This will permanently remove this order from your sales records.`
        );


    if (!confirmation) {
        return;
    }


    const updatedOrders =
        orders.filter(
            order =>
                order.id !== orderId
        );


    localStorage.setItem(
        "geraiOrders",
        JSON.stringify(updatedOrders)
    );


    /*
       IMPORTANT:
       We do NOT reduce geraiOrderCounter.

       Example:
       Delete Order #25
       Next order will still be #26,
       not #25 again.
    */


    renderDashboard();

}


// ==========================================
// RENDER DASHBOARD
// ==========================================

function renderDashboard() {

    const dateOrders =
        getDateFilteredOrders();


    const paidOrders =
        dateOrders.filter(
            order =>
                order.status === "Paid"
        );


    const pendingOrders =
        dateOrders.filter(
            order =>
                order.status === "Pending"
        );


    const paidSales =
        paidOrders.reduce(
            (total, order) =>
                total +
                Number(order.total),

            0
        );


    document
        .getElementById(
            "paidSales"
        )
        .textContent =
            "$" +
            paidSales.toFixed(2);


    document
        .getElementById(
            "totalOrders"
        )
        .textContent =
            dateOrders.length;


    document
        .getElementById(
            "paidOrders"
        )
        .textContent =
            paidOrders.length;


    document
        .getElementById(
            "pendingOrders"
        )
        .textContent =
            pendingOrders.length;


    const visibleOrders =

        statusFilter === "All"

            ? dateOrders

            : dateOrders.filter(
                order =>
                    order.status ===
                    statusFilter
            );


    renderItems(
        visibleOrders
    );


    renderOrders(
        visibleOrders
    );


    updateTitle(
        dateOrders.length
    );

}


// ==========================================
// ITEMS PURCHASED
// ==========================================

function renderItems(orders) {

    const container =
        document.getElementById(
            "itemBreakdown"
        );


    const counts = {};


    orders.forEach(order => {

        order.items.forEach(item => {

            const quantity =
                Number(
                    item.quantity
                ) || 0;


            if (!counts[item.name]) {

                counts[item.name] = 0;

            }


            counts[item.name] +=
                quantity;


            /*
               Also track add-ons.
            */

            if (
                item.addons &&
                item.addons.length
            ) {

                item.addons
                    .forEach(addon => {

                        const key =
                            "+ " +
                            addon.name;


                        if (!counts[key]) {

                            counts[key] = 0;

                        }


                        counts[key] +=
                            quantity;

                    });

            }

        });

    });


    const entries =
        Object.entries(counts)
            .sort(
                (a, b) =>
                    b[1] - a[1]
            );


    if (
        entries.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">
                No items found.
            </div>

        `;

        return;
    }


    container.innerHTML = "";


    const icons = {

        "Normal Burger":
            "🍔",

        "Special Burger":
            "🍔",

        "BBQ Sausage":
            "🌭",

        "Butter Jagung":
            "🌽",

        "Cheese Jagung":
            "🌽",

        "Peach Tea":
            "🍑",

        "+ Egg":
            "🥚",

        "+ Double Patty":
            "🍔"

    };


    entries.forEach(
        ([name, count]) => {


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "item-row";


            row.innerHTML = `

                <div class="item-name">

                    ${icons[name] || "•"}
                    ${name}

                </div>


                <div class="item-count">

                    ${count}

                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}


// ==========================================
// ORDER HISTORY
// ==========================================

function renderOrders(orders) {

    const container =
        document.getElementById(
            "orderHistory"
        );


    if (
        orders.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">
                No orders found.
            </div>

        `;

        return;
    }


    container.innerHTML = "";


    [...orders]
        .sort(
            (a, b) =>
                b.id - a.id
        )
        .forEach(order => {


            const box =
                document.createElement(
                    "div"
                );


            box.className = "order";


            const statusClass =

                order.status === "Paid"

                    ? "status-paid"

                    : "status-pending";


            const date =
                new Date(order.id);


            let itemsHTML = "";


            order.items.forEach(item => {


                const qty =
                    Number(
                        item.quantity
                    ) || 0;


                const itemPrice =
                    Number(
                        item.price
                    ) || 0;


                itemsHTML += `

                    <div class="order-item">

                        <span>

                            ${item.name}
                            × ${qty}

                        </span>


                        <strong>

                            $${(
                                itemPrice *
                                qty
                            ).toFixed(2)}

                        </strong>

                    </div>

                `;


                if (
                    item.addons &&
                    item.addons.length
                ) {

                    const addonText =
                        item.addons
                            .map(
                                addon =>
                                    `+ ${addon.name}`
                            )
                            .join(", ");


                    itemsHTML += `

                        <div class="order-addon">

                            ${addonText}

                        </div>

                    `;

                }

            });


            box.innerHTML = `

                <div class="order-header">

                    <div>

                        <div class="order-number">

                            Order #${order.orderNumber}

                        </div>


                        <div class="order-time">

                            ${
                                date.toLocaleString(
                                    undefined,
                                    {
                                        day:
                                            "numeric",

                                        month:
                                            "short",

                                        year:
                                            "numeric",

                                        hour:
                                            "2-digit",

                                        minute:
                                            "2-digit"
                                    }
                                )
                            }

                        </div>

                    </div>


                    <span
                        class="status ${statusClass}">

                        ${order.status}

                    </span>

                </div>


                <div class="order-items">

                    ${itemsHTML}

                </div>


                <div class="order-footer">

                    <div class="order-total">

                        $${Number(
                            order.total
                        ).toFixed(2)}

                    </div>


                    <div class="order-actions">


                        <button
                            class="delete-order"
                            onclick="deleteOrder(${order.id})">

                            🗑 Delete Order

                        </button>


                        ${
                            order.status ===
                            "Pending"

                                ?

                                `<button
                                    class="mark-paid"
                                    onclick="markPaid(${order.id})">

                                    ✓ Mark as Paid

                                </button>`

                                :

                                ""
                        }


                    </div>

                </div>

            `;


            container.appendChild(
                box
            );

        });

}


// ==========================================
// TITLE
// ==========================================

function updateTitle(count) {

    let text = "";


    if (
        dateFilter === "today"
    ) {

        text = "Today's orders";

    }


    else if (
        dateFilter === "yesterday"
    ) {

        text =
            "Yesterday's orders";

    }


    else if (
        dateFilter === "all"
    ) {

        text = "All orders";

    }


    else {

        text =
            chosenDate
                .toLocaleDateString(
                    undefined,
                    {
                        day:
                            "numeric",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );

    }


    document
        .getElementById(
            "viewTitle"
        )
        .textContent =

        `${text} • ${count} order${count !== 1 ? "s" : ""}`;

}


// ==========================================
// START
// ==========================================

renderDashboard();

</script>

</body>
</html>
